[project]
name = "codemap"
version = "0.1.0"
description = "Trace one system in a codebase into a zoomable graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "pathspec>=0.12",
    "tree-sitter-language-pack>=0.13,<0.14",
    "tree-sitter>=0.25.2,<0.26",
    "platformdirs>=4.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "openai>=3.35.1",
]

[project.scripts]
codemap = "codemap.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/codemap/server/static/**"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/codemap"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["codemap"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
